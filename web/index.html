<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GW KALU - HD Web Audio Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090c10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Smokey Neon Background Orbs */
    .smoke-bg {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.45) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      top: 10%;
      left: 15%;
      z-index: 0;
      animation: floatSmoke 8s ease-in-out infinite alternate;
    }
    .smoke-bg-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 191, 255, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(75px);
      bottom: 10%;
      right: 15%;
      z-index: 0;
      animation: floatSmoke 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatSmoke {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -40px) scale(1.15); }
    }

    /* Glassmorphism Card Container */
    .glass-card {
      position: relative;
      z-index: 1;
      background: rgba(22, 27, 34, 0.55);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 30px 24px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    /* Vinyl Album Art */
    .album-art-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 20px auto;
    }
    .album-art {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 25px rgba(0, 191, 255, 0.4);
      animation: spin 18s linear infinite;
      animation-play-state: paused;
    }
    .playing .album-art {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .file-title {
      font-size: 17px;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 10px;
      word-break: break-word;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .notice {
      background: rgba(255, 77, 77, 0.12);
      color: #ff6b6b;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 77, 77, 0.25);
      letter-spacing: 0.5px;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      filter: invert(0.9) hue-rotate(170deg);
      outline: none;
    }

    /* Custom HD Skip Buttons */
    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-skip {
      background: rgba(255, 255, 255, 0.06);
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.25);
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-skip:active {
      transform: scale(0.92);
      background: rgba(0, 210, 255, 0.2);
    }

    /* Speed Selector Box */
    .speed-container {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #8b949e;
    }

    select {
      background: #161b22;
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 600;
      outline: none;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #6e7681;
      line-height: 1.6;
    }
    footer .brand { color: #00d2ff; font-weight: bold; }
  </style>
</head>
<body>

  <div class="smoke-bg"></div>
  <div class="smoke-bg-2"></div>

  <div class="glass-card" id="card">
    <div class="album-art-wrap">
      <img id="poster" class="album-art" src="https://cdn-icons-png.flaticon.com/512/3293/3293810.png" alt="Thumbnail">
    </div>

    <div id="fileName" class="file-title">Audio File</div>
    <div class="notice">🔒 Stream Only (Save & Download Disabled)</div>

    <audio id="audio" controls controlsList="nodownload noremoteplayback">
      <source id="audioSrc" src="" type="audio/mpeg">
    </audio>

    <div class="controls">
      <button class="btn-skip" onclick="skip(-10)">⏪ 10s</button>
      <button class="btn-skip" onclick="skip(10)">10s ⏩</button>
    </div>

    <div class="speed-container">
      <span>प्लेबैक स्पीड:</span>
      <select id="speed" onchange="document.getElementById('audio').playbackRate = parseFloat(this.value)">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x (Normal)</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
    </div>
  </div>

  <footer>
    <p>This file only streams. Download & save options are disabled.</p>
    <p>© 2026 GW KALU. All Rights Reserved.</p>
    <p class="brand">Powered by GW KALU</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file_id');
    const name = urlParams.get('name');
    const audio = document.getElementById('audio');
    const card = document.getElementById('card');

    if (name) {
      document.getElementById('fileName').innerText = decodeURIComponent(name);
    }
    if (fileId) {
      document.getElementById('audioSrc').src = `/stream/${fileId}`;
      audio.load();
    }

    function skip(seconds) {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration);
      }
    }

    audio.addEventListener('play', () => card.classList.add('playing'));
    audio.addEventListener('pause', () => card.classList.remove('playing'));
    audio.addEventListener('ended', () => card.classList.remove('playing'));
  </script>
</body>
</html>
